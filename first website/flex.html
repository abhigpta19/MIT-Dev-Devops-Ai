<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            margin: 3px;
            padding: 3px;
            border: 2px solid black;
            height: 500px;
            width: 500px;
            display: flex;
            flex-direction: row;
            justify-content:space-between;
            align-items: flex-end;
        }
        .box{
            margin: 3px;
            padding: 3px;
            height: 10px;
            width: 10px;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</body>
</html>
