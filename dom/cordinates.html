<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        div{
            position: absolute;
        }
    </style>
</head>
<body>
    <div id="container">
    </div>
    <script>
        document.addEventListener("click",function(e){
            let x = e.clientX;
            let y = e.clientY;

            let mini = 30;
            let maxi = 100;

            let r = mini + Math.random()*(maxi-mini);

            let ml = x-r;
            let mt = y-r;

            let box = document.createElement("div");
            box.style.height = `${2*r}px`;
            box.style.width = `${2*r}px`;
            box.style.border= "2px solid black";
            box.style.borderRadius = "50%";
            box.style.marginLeft = `${ml}px`;
            box.style.marginTop = `${mt}px`;

            const container = document.getElementById("container");
            container.append(box)
        })
    </script>
</body>
</html>
