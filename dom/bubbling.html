<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
        margin: 50px;
        padding: 50px;
        border: 2px solid black;
    }
    .father{
        border: 4px solid red;
    }
    .child{
        border: 4px solid red;
    }
    .grandfather{
        border: 4px solid red;
    }
</style>
<body>
    <div class="grandfather">
        <h1>Grandfather</h1>
        <div class="father">
            <h1>father</h1>
            <div class="child">
                <h1>child</h1>
            </div>
        </div>
    </div>
    <script>
        const grand = document.getElementsByClassName("grandfather")[0];
        grand.addEventListener("click",function(e){
            alert("capturing grandfather clicked");
            // e.stopPropagation();
        },true)


        // grand.addEventListener(eventname,fn,f)

        const father = document.getElementsByClassName("father")[0];
        father.addEventListener("click",function(e){
            alert("bubbling father clicked");
            // e.stopPropagation();
        },false)

        const child = document.getElementsByClassName("child")[0];
        
        child.addEventListener("click",function(e){
            alert("bubbling child clicked");
            // e.stopPropagation();
        },false)
    </script>
</body>
</html>
